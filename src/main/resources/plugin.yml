name: NEXORA-PLAYERS
version: '${version}'
main: com.nexora.players.NexoraPlayers
api-version: '26.2'
description: AI chat personas for Paper servers, powered by OpenRouter or Ollama.
author: NEXORA
commands:
  nexoraplayers:
    description: Manage NEXORA-PLAYERS AI chat agents
    usage: /nexoraplayers <bots|talk|reload>
    aliases: [np]
permissions:
  nexoraplayers.admin:
    description: Reload and manage NEXORA-PLAYERS
    default: op
  nexoraplayers.talk:
    description: Talk directly to an AI persona
    default: true
