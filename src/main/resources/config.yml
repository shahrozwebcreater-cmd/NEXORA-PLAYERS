# NEXORA-PLAYERS 1.3.0
# Keep your OpenRouter API key private. Set it here or use NEXORA_AI_API_KEY.
ai:
  enabled: true
  provider: "openrouter"
  endpoint: "https://openrouter.ai/api/v1"
  model: "openrouter/free"
  api-key: ""
  timeout-seconds: 45
  max-tokens: 120
  temperature: 0.85

chat:
  prefix: "&8[&bAI&8] "
  respond-to-normal-chat: true
  respond-chance-percent: 18
  reply-cooldown-seconds: 25
  global-cooldown-seconds: 8
  minimum-message-length: 3
  maximum-reply-length: 180
  ignore-commands: true
  # Disabled by default because FightBotBridge handles bot-to-bot starters.
  allow-initiate-conversations: false
  initiate-every-minutes: 12
  initiate-chance-percent: 20
  only-initiate-when-players-online: 1

fightbot-chat:
  enabled: true
  # A bot-to-bot conversation may start on this interval.
  interval-minutes: 2
  chance-percent: 85
  minimum-bots: 2
  minimum-online-players: 0
  max-messages-per-hour: 36
  # Chance that one selected FightBot replies to ordinary player chat.
  player-reply-chance-percent: 100
  player-reply-cooldown-seconds: 12
  conversation-max-turns: 6
  conversation-delay-min-seconds: 8
  conversation-delay-max-seconds: 18
  default-personality: "You are a Pakistani Minecraft player. Talk naturally in Roman Urdu mixed with English, like friends on a Pakistani Minecraft server. Be funny, sociable, casual, and varied. Discuss PvP, kits, survival, server events, jokes, games, music, and everyday topics. Never sound like an assistant."

memory:
  recent-messages: 12
  remember-player-messages: true
  max-player-messages: 100

personas:
  - name: Alex
    display-name: "&bAlex"
    personality: "Friendly survival player. Likes building, exploring, and helping new players."
    greeting: "Anyone exploring today?"
  - name: Raven
    display-name: "&5Raven"
    personality: "Competitive PvP player. Confident, playful, enjoys fair 1v1 challenges, never toxic."
    greeting: "Who's up for a fair 1v1?"
  - name: Milo
    display-name: "&aMilo"
    personality: "Curious and funny player. Loves random topics, Minecraft trivia, and jokes."
    greeting: "Random question: what's the weirdest thing you've built?"
